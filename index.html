  <style>
    :root {
      --bg: #ffffff;
      --text: #1f2328;
      --text-bright: #000000;
      --muted: #656d76;
      --border: #d0d7de;
      --accent: #0969da;
      --accent-hover: #0550ae;
      --tag-bg: #f6f8fa;
      --font-sans: 'Montserrat', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      --font-mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      background-color: var(--bg);
      color: var(--text);
    }

    body {
      font-family: var(--font-sans);
      font-size: 14px;
      line-height: 1.65;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      max-width: 680px;
      margin: 0 auto;
      padding: 4.5rem 1.5rem 6rem;
    }

    /* Links */
    a {
      color: var(--accent);
      text-decoration: none;
      transition: color 0.15s ease;
    }

    a:hover {
      color: var(--accent-hover);
      text-decoration: underline;
    }

    /* Typography */
    h1 {
      font-size: 1.35rem;
      font-weight: 700;
      letter-spacing: -0.03em;
      color: var(--text-bright);
      margin-bottom: 0.35rem;
    }

    h2 {
      font-size: 0.8rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--muted);
      margin-top: 3.5rem;
      margin-bottom: 1.25rem;
      padding-bottom: 0.35rem;
      border-bottom: 1px solid var(--border);
    }

    p {
      margin-bottom: 1rem;
    }

    .bio {
      color: var(--text);
      font-size: 0.95rem;
      line-height: 1.7;
      margin-bottom: 1rem;
    }

    .meta {
      font-family: var(--font-mono);
      color: var(--muted);
      font-size: 0.85rem;
      font-variant-numeric: tabular-nums;
    }

    .meta a {
      color: var(--muted);
      text-decoration: underline;
      text-underline-offset: 3px;
    }

    .meta a:hover {
      color: var(--accent);
    }

    /* Project Entries */
    .project-entry {
      margin-bottom: 2rem;
    }

    .entry-header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 0.25rem;
    }

    .entry-title {
      font-weight: 600;
      letter-spacing: -0.01em;
      color: var(--text-bright);
    }

    .entry-tags {
      display: inline-block;
      font-family: var(--font-mono);
      font-size: 0.75rem;
      color: var(--muted);
      background: var(--tag-bg);
      border: 1px solid var(--border);
      padding: 0.15rem 0.45rem;
      border-radius: 4px;
      margin-bottom: 0.5rem;
    }

    .entry-desc {
      color: var(--text);
      font-size: 0.9rem;
      line-height: 1.6;
    }

    /* Writing Section */
    .writing-list {
      list-style: none;
    }

    .writing-item {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      padding: 0.4rem 0;
      border-bottom: 1px dashed var(--border);
    }

    .writing-item:last-child {
      border-bottom: none;
    }

    .writing-date {
      font-family: var(--font-mono);
      font-size: 0.8rem;
      color: var(--muted);
      white-space: nowrap;
      margin-left: 1rem;
      font-variant-numeric: tabular-nums;
    }

    /* Footer */
    footer {
      margin-top: 5rem;
      padding-top: 1.5rem;
      border-top: 1px solid var(--border);
      font-family: var(--font-mono);
      font-size: 0.8rem;
      color: var(--muted);
      display: flex;
      justify-content: space-between;
    }

    @media (max-width: 600px) {
      body {
        padding: 2.5rem 1.25rem 4rem;
      }
      .entry-header {
        flex-direction: column;
      }
      .writing-item {
        flex-direction: column;
        gap: 0.15rem;
      }
      .writing-date {
        margin-left: 0;
      }
      footer {
        flex-direction: column;
        gap: 0.5rem;
      }
    }
  </style>
</head>
