<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"> <!-- Tells the browser's parser to interpret the raw bytes of your
   HTML file using UTF-8 (Unicode Transformation Format, 8-bit).-->
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- Controls how
   mobile browsers calculate page dimensions and scaling.-->
  <meta name="description" content="Personal portfolio and engineering log."> <!-- Provides
 a concise, plaintext summary of the page for search engine crawlers and link unfurlers.-->
  <title>hrushi1406</title>

  <!-- Google Fonts: IBM Plex Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #ffffff;
      --text: #1f2328;
      --text-bright: #000000;
      --muted: #656d76;
      --border: #d0d7de;
      --accent: #0969da;
      --accent-hover: #0550ae;
      --tag-bg: #f6f8fa;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      background-color: var(--bg);
      color: var(--text);
    }

    body {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 14px;
      line-height: 1.65;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      max-width: 70ch;
      margin: 0 auto;
      padding: 4.5rem 1.5rem 6rem;
    }

    /* Links */
    a {
      color: var(--accent);
      text-decoration: none;
      transition: color 0.15s ease;
    }

    a:hover {
      color: var(--accent-hover);
      text-decoration: underline;
    }

    /* Typography */
    h1 {
      font-size: 1.15rem;
      font-weight: 600;
      color: var(--text-bright);
      margin-bottom: 0.25rem;
    }

    h2 {
      font-size: 0.85rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--muted);
      margin-top: 3.5rem;
      margin-bottom: 1.25rem;
      padding-bottom: 0.35rem;
      border-bottom: 1px solid var(--border);
    }

    p {
      margin-bottom: 1rem;
    }

    .bio {
      color: var(--text);
      margin-bottom: 1rem;
    }

    .meta {
      color: var(--muted);
      font-size: 0.85rem;
    }

    .meta a {
      color: var(--muted);
      text-decoration: underline;
      text-underline-offset: 3px;
    }

    .meta a:hover {
      color: var(--accent);
    }

    /* Project Entries */
    .project-entry {
      margin-bottom: 2rem;
    }

    .entry-header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 0.25rem;
    }

    .entry-title {
      font-weight: 600;
      color: var(--text-bright);
    }

    .entry-tags {
      display: inline-block;
      font-family: var(--font-mono);
      font-size: 0.75rem;
      color: var(--muted);
      background: var(--tag-bg);
      border: 1px solid var(--border);
      padding: 0.15rem 0.45rem;
      border-radius: 3px;
      margin-bottom: 0.5rem;
    }

    .entry-desc {
      color: var(--text);
      font-size: 0.9rem;
      line-height: 1.6;
    }

    /* Writing Section */
    .writing-list {
      list-style: none;
    }

    .writing-item {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      padding: 0.4rem 0;
      border-bottom: 1px dashed var(--border);
    }

    .writing-item:last-child {
      border-bottom: none;
    }

    .writing-date {
      font-size: 0.8rem;
      color: var(--muted);
      white-space: nowrap;
      margin-left: 1rem;
    }

    /* Footer */
    footer {
      margin-top: 5rem;
      padding-top: 1.5rem;
      border-top: 1px solid var(--border);
      font-family: var(--font-mono);
      font-size: 0.8rem;
      color: var(--muted);
      display: flex;
      justify-content: space-between;
    }

    @media (max-width: 600px) {
      body {
        padding: 2.5rem 1.25rem 4rem;
      }
      .entry-header {
        flex-direction: column;
      }
      .writing-item {
        flex-direction: column;
        gap: 0.15rem;
      }
      .writing-date {
        margin-left: 0;
      }
      footer {
        flex-direction: column;
        gap: 0.5rem;
      }
    }
  </style>
</head>
<body>

  <!-- Header -->
  <header>
    <h1>Hrushikesh Warang</h1>
    <p class="bio">
      Hi, I'm Hrushikesh, a freshman. i like programming.
    </p>
    <div class="meta">
      <a href="https://github.com/hrushi1406" target="_blank" rel="noopener">github</a> &bull;

      <a href="mailto:your.hrushiwarang@gmail.com">email</a> &bull;
      <a href=""./bookmarks.html">bookmarks</a>
      <!--<a href="./resume.pdf" target="_blank">resume.pdf</a> -->
    </div>
  </header>

  <main>
    
   

    <!-- Background / Education -->
    <section>
      <h2>Education &amp; Background</h2>
      <div class="project-entry">
        <div class="entry-header">
          <span class="entry-title">B.Tech. in Computer Science and Engineering</span>
          <span class="meta">2026 &mdash; Present</span>
        </div>
      </div>
    </section>
  </main>

  <!-- Footer -->
  <footer>
    <span>Updated: 15 Sep 2026, 23:25 IST.</span>
  </footer>

</body>
</html>
