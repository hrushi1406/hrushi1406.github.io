<!DOCTYPE html>
<html lang="en">
<head>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Curated vault of engineering articles, lectures, papers, and tools.">
  
  <title>bookmarks &mdash; hrushi1406</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #ffffff;
      --text: #1f2328;
      --text-bright: #000000;
      --muted: #656d76;
      --border: #d0d7de;
      --accent: #0969da;
      --accent-hover: #0550ae;
      --tag-bg: #f6f8fa;
    }

    * { 
      box-sizing: border-box; margin: 0; padding: 0; 
    }
    html { 
      background-color: var(--bg); color: var(--text); 
    }

    body {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 14px;
      line-height: 1.65;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      max-width: 70ch;
      margin: 0 auto;
      padding: 4.5rem 1.5rem 6rem;
    }
    a { 
      color: var(--accent); text-decoration: none; transition: color 0.15s ease; 
    }

    a:hover { 
      color: var(--accent-hover); text-decoration: underline; 
    }

    h1 { 
      font-size: 1.15rem; font-weight: 600; color: var(--text-bright); margin-bottom: 0.25rem; 
    }

    h2 {
      font-size: 0.85rem; font-weight: 600; text-transform: uppercase;
      letter-spacing: 0.08em; color: var(--muted);
      margin-top: 3.5rem; margin-bottom: 1.25rem;
      padding-bottom: 0.35rem; border-bottom: 1px solid var(--border);
    }

    p { 
      margin-bottom: 1rem; 
    }

    .meta { 
      color: var(--muted); font-size: 0.85rem; margin-bottom: 1rem; 
    }

    .meta a { 
      color: var(--muted); text-decoration: underline; text-underline-offset: 3px; 
    }
    
    .meta a:hover { 
      color: var(--accent); 
    }

    .vault-list { 
      display: flex; flex-direction: column; gap: 1.5rem; 
    }

    .vault-item { 
      display: flex; flex-direction: column; gap: 0.25rem; 
    }

    .vault-header { 
      display: flex; justify-content: space-between; align-items: baseline; gap: 1rem; 
    }

    .vault-title { 
      font-weight: 600; color: var(--text-bright); 
    }

    .vault-meta {
      font-size: 0.75rem; color: var(--muted); 
      background: var(--tag-bg);
      border: 1px solid var(--border); 
      padding: 0.1rem 0.4rem; 
      border-radius: 3px;
      white-space: nowrap; 
      flex-shrink: 0;
    }

    .vault-note { 
      color: var(--text); 
      font-size: 0.88rem; 
      line-height: 1.55; 
      margin-bottom: 0; 
    }

    .empty-state { 
      color: var(--muted); 
      font-size: 0.88rem; 
    }
    footer {
      margin-top: 5rem; 
      padding-top: 1.5rem; 
      border-top: 1px solid var(--border);
      font-size: 0.8rem; 
      color: var(--muted); 
      display: flex; 
      justify-content: space-between;
    }

    @media (max-width: 600px) {

      body { 
        padding: 2.5rem 1.25rem 4rem; 
      }
      
      .vault-header { 
        flex-direction: column; gap: 0.2rem; 
      }
      footer { 
        flex-direction: column; gap: 0.5rem; 
      }

    }
  </style>
</head>
<body>

  <header>
    <h1>Bookmarks</h1>
    <div class="meta">
      <a href="./index.html">&larr; back to home</a>
    </div>
    <p>A storage for articles, talks, engineering papers, and tools I find worth keeping.</p>
  </header>

  <main id="vault-root">
    <p class="empty-state">Loading&hellip;</p>
  </main>

  <footer>
    <a href="./index.html">&larr; home</a>
    <span>bookmarks &bull; hrushi1406</span>
  </footer>

  <script>
    // Categories render in this order first; any category not listed here
    // is appended afterward, in the order it first appears in the JSON.
    const CATEGORY_ORDER = [
      "Articles & Essays",
      "Lectures, Talks and Youtube",
      "Papers"
    ];

    function escapeHtml(str) {
      const div = document.createElement('div');
      div.textContent = str;
      return div.innerHTML;
    }

    function renderVault(entries) {
      const root = document.getElementById('vault-root');
      root.innerHTML = '';

      if (!entries || entries.length === 0) {
        root.innerHTML = '<p class="empty-state">No bookmarks yet.</p>';
        return;
      }

      const groups = new Map();
      for (const entry of entries) {
        const cat = entry.category || 'Uncategorized';
        if (!groups.has(cat)) groups.set(cat, []);
        groups.get(cat).push(entry);
      }

      const orderedCats = [
        ...CATEGORY_ORDER.filter(c => groups.has(c)),
        ...[...groups.keys()].filter(c => !CATEGORY_ORDER.includes(c))
      ];

      for (const cat of orderedCats) {
        const section = document.createElement('section');

        const h2 = document.createElement('h2');
        h2.textContent = cat;
        section.appendChild(h2);

        const list = document.createElement('div');
        list.className = 'vault-list';

        for (const entry of groups.get(cat)) {
          const item = document.createElement('div');
          item.className = 'vault-item';
          item.innerHTML = `
            <div class="vault-header">
              <a href="${escapeHtml(entry.url)}" class="vault-title" target="_blank" rel="noopener">
                ${escapeHtml(entry.title)}
              </a>
              <span class="vault-meta">${escapeHtml(entry.source || '')}</span>
            </div>
            <p class="vault-note">${escapeHtml(entry.note || '')}</p>
          `;
          list.appendChild(item);
        }

        section.appendChild(list);
        root.appendChild(section);
      }
    }

    fetch('./bookmarks.json')
      .then(res => {
        if (!res.ok) throw new Error('Failed to load bookmarks.json');
        return res.json();
      })
      .then(renderVault)
      .catch(err => {
        document.getElementById('vault-root').innerHTML =
          '<p class="empty-state">Could not load bookmarks.json &mdash; ' + escapeHtml(err.message) + '</p>';
        console.error(err);
      });
  </script>

</body>
</html>
